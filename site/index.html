<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Take advantage of the other 50% of your plan with one explicitly exposed workspace."
    />
    <meta name="theme-color" content="#111016" />
    <title>Glossa</title>
    <link rel="icon" href="/glossa-symbol.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=40" />
  </head>
  <body class="landing-shell">
    <header class="site-header page-width">
      <a class="brand" href="/" aria-label="Glossa home">
        <img class="brand-symbol" src="/glossa-symbol.svg" alt="" />
        <span>Glossa</span>
      </a>
      <nav class="header-links" aria-label="Site navigation">
        <a href="/docs/quickstart">Quickstart</a>
        <a href="/security">Security</a>
        <a href="/support">Support</a>
        <a href="https://github.com/ariobarin/glossa">GitHub</a>
      </nav>
    </header>

    <main class="landing-main page-width">
      <section class="landing-hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Take advantage of the <span>other 50% of your plan.</span></h1>
          <div class="hero-action-row">
            <a class="primary-action" href="/docs/quickstart">Quickstart</a>
            <a class="secondary-action" href="/docs/why">What?</a>
          </div>
          <div class="hero-installer">
            <div class="hero-installer-heading">
              <span>Install with npm</span>
            </div>
            <div class="hero-install-panel">
              <div class="code-block hero-code-block">
                <button
                  class="copy-button"
                  type="button"
                  aria-label="Copy npm install command"
                  data-copy-target="hero-install-npm"
                ><span class="copy-tooltip" aria-hidden="true">Copy</span></button>
                <pre><code id="hero-install-npm">npm install -g @ariobarin/glossa@beta</code></pre>
              </div>
            </div>
          </div>
          <p class="hero-footnote">Install, run <code>glossa</code> in a folder, then connect ChatGPT.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner page-width">
        <span>Need help? <a href="/support">Visit support.</a></span>
        <nav aria-label="Legal and support">
          <a href="/security">Security</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/support">Support</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="/copy.js"></script>
  </body>
</html>
