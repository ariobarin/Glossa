name: Deploy Staging Relay

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: heroku-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_ORIGIN }}
    steps:
      - id: target
        name: Resolve tested staging target
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "Staging deployment is disabled."
            exit 0
          fi
          if [[ "$RUN_EVENT" != "push" || "$RUN_CONCLUSION" != "success" ]]; then
            echo "Ignoring non-push or unsuccessful CI run."
            exit 0
          fi
          if [[ "$RUN_BRANCH" != staging/contract-v* ]]; then
            echo "Ignoring CI run outside a version-staging branch."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "ref=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.target.outputs.deploy == 'true'
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Deploy tested commit to staging Heroku
        if: steps.target.outputs.deploy == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.STAGING_HEROKU_API_KEY }}
          HEROKU_APP: ${{ vars.STAGING_HEROKU_APP }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HEROKU_API_KEY" ]]; then
            echo "The staging environment is missing STAGING_HEROKU_API_KEY." >&2
            exit 1
          fi
          if [[ -z "$HEROKU_APP" ]]; then
            echo "The staging environment is missing STAGING_HEROKU_APP." >&2
            exit 1
          fi
          git config --global credential.helper store
          printf '%s\n' "https://heroku:${HEROKU_API_KEY}@git.heroku.com" > ~/.git-credentials
          trap 'rm -f ~/.git-credentials' EXIT
          git push "https://git.heroku.com/${HEROKU_APP}.git" HEAD:main

      - name: Verify staging health and OAuth resource
        if: steps.target.outputs.deploy == 'true'
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 10 \
            "$HEALTH_URL" >/dev/null
          node --input-type=module <<'NODE'
          const origin = process.env.STAGING_ORIGIN;
          const metadata = await fetch(`${origin}/.well-known/oauth-protected-resource`).then(async (response) => {
            if (!response.ok) throw new Error(`OAuth metadata returned ${response.status}`);
            return response.json();
          });
          const expected = `${origin.replace(/\/$/, "")}/`;
          if (metadata.resource !== expected) {
            throw new Error(`Unexpected OAuth resource: ${JSON.stringify(metadata)}`);
          }
          NODE
