name: CLI release

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "cli-v${version}" = "${GITHUB_REF_NAME}"
          fi
      - name: Run release checks
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$version" == *-* ]]; then
            GLOSSA_ALLOW_PRERELEASE=1 npm run check
          else
            npm run check
          fi

  publish-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build --workspace @glossa/protocol
      - run: npm run build --workspace @ariobarin/glossa
      - name: Publish package
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$version" == *-* ]]; then
            tag=beta
          else
            tag=latest
          fi
          npm publish --workspace @ariobarin/glossa --tag "$tag"

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#cli-v}
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Glossa $version" \
            --notes "Glossa CLI $version." \
            "${prerelease[@]}"
